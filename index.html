<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웹 카메라 진단 V2</title><style>body{font:16px system-ui;margin:16px;background:#f5f7fa;color:#172334}video{width:100%;max-height:32vh;background:#222}button,select{padding:12px;margin:4px;font-size:16px;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px}label{display:block;margin-top:12px}</style></head><body><h2>웹 카메라 독립 진단 V2</h2><p>외부 라이브러리 없이 개별 카메라를 검사합니다.</p><video id="v" autoplay muted playsinline></video><div><button id="front">전면 카메라</button><button id="rear">후면 카메라</button><button id="stop">카메라 종료</button><button id="auto">자동 선택</button></div><hr><button id="scan">① 카메라 목록 조회</button><label for="devices">② 카메라 선택</label><select id="devices"><option value="">목록을 조회하세요</option></select><label for="quality">해상도 조건</label><select id="quality"><option value="default">기본 (해상도 지정 없음)</option><option value="low">저해상도 (640×480, 15fps 선호)</option><option value="hd">HD (1280×720, 30fps 선호)</option></select><div><button id="direct">③ 선택한 카메라 실행</button></div><button id="copy">로그 복사</button><pre id="log"></pre><script>
const $=id=>document.getElementById(id),v=$('v'),out=$('log'),devices=$('devices');let stream=null,busy=false,epoch=0;
function log(s){out.textContent+=new Date().toLocaleTimeString()+' '+s+'\n'}
function stop(){epoch++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.pause();v.srcObject=null;log('카메라 종료 요청 완료')}
async function scan(){try{const list=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');devices.replaceChildren(new Option('카메라를 선택하세요',''));log('카메라 목록: '+list.length+'개');list.forEach((d,i)=>{const name=d.label||'이름 미공개';const opt=new Option((i+1)+'. '+name,d.deviceId);opt.disabled=!d.deviceId;devices.add(opt);log((i+1)+'. '+name+' / ID: '+(d.deviceId?d.deviceId.slice(0,12)+'…':'미공개'))});if(!list.some(d=>d.deviceId&&d.label))log('전면 카메라를 먼저 실행하여 권한을 허용한 뒤 다시 조회하세요.')}catch(e){log('목록 실패: '+e.name+' / '+e.message)}}
async function start(mode,id){if(busy){log('이전 요청 처리 중');return}busy=true;stop();const token=epoch;let timer;try{await new Promise(r=>setTimeout(r,1500));if(token!==epoch)return;let c={};if(mode==='direct')c.deviceId={exact:id};else if(mode!=='any')c.facingMode={exact:mode};const q=$('quality').value;if(q==='low')Object.assign(c,{width:{ideal:640},height:{ideal:480},frameRate:{ideal:15}});if(q==='hd')Object.assign(c,{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}});log('호출: '+mode+' / '+q+(id?' / ID: '+id.slice(0,12)+'…':''));timer=setTimeout(()=>log('15초 경과: 브라우저 응답 대기 중'),15000);const s=await navigator.mediaDevices.getUserMedia({audio:false,video:Object.keys(c).length?c:true});if(token!==epoch){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;const t=s.getVideoTracks()[0],a=t.getSettings();log('획득 성공: '+t.label+' / 방향: '+(a.facingMode||'미제공')+' / '+a.width+'×'+a.height+' / fps: '+a.frameRate);await v.play();if(token===epoch)log('영상 재생 성공')}catch(e){log('실패: '+e.name+' / '+e.message+(e.constraint?' / '+e.constraint:''));if(token===epoch)stop()}finally{clearTimeout(timer);busy=false}}
$('front').onclick=()=>start('user');$('rear').onclick=()=>start('environment');$('auto').onclick=()=>start('any');$('stop').onclick=stop;$('scan').onclick=scan;$('direct').onclick=()=>{if(!devices.value){log('카메라를 먼저 선택하세요');return}start('direct',devices.value)};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);log('로그 복사 완료')}catch(e){log('복사 실패: '+e.message)}};window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});log('진단 V2 / HTTPS: '+isSecureContext);log(navigator.userAgent);
</script></body></html>
