<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카메라 진단</title><style>body{font:16px system-ui;margin:16px;background:#f5f7fa;color:#172334}video{width:100%;max-height:40vh;background:#222}button{padding:12px;margin:4px;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px}</style></head><body><h2>웹 카메라 독립 진단</h2><p>외부 AR 라이브러리 없이 카메라만 검사합니다.</p><video id="v" autoplay muted playsinline></video><div><button onclick="start('user')">전면 카메라</button><button onclick="start('environment')">후면 카메라</button><button onclick="stop()">카메라 종료</button><button onclick="start('any')">카메라 자동 선택</button></div><pre id="log"></pre><script>
const v=document.getElementById('v'),out=document.getElementById('log');let stream=null,busy=false,epoch=0;function log(s){out.textContent+=new Date().toLocaleTimeString()+' '+s+'\n'}function stop(){epoch++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;log('카메라 종료 요청 완료');}async function start(mode){if(busy){log('이전 요청 처리 중');return}busy=true;stop();const token=epoch;let timer;try{await new Promise(r=>setTimeout(r,800));if(token!==epoch)return;if(!navigator.mediaDevices?.getUserMedia)throw new Error('getUserMedia 사용 불가');log('호출: '+mode);timer=setTimeout(()=>log('15초 경과: 카메라 응답 대기 중'),15000);const s=await navigator.mediaDevices.getUserMedia({audio:false,video:mode==='any'?true:{facingMode:{exact:mode}}});if(token!==epoch){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;log('카메라 획득 성공: '+JSON.stringify(s.getVideoTracks()[0].getSettings()));await v.play();log('영상 재생 성공');}catch(e){log('실패: '+e.name+' / '+e.message+(e.constraint?' / '+e.constraint:''));if(token===epoch)stop();}finally{clearTimeout(timer);busy=false;}}window.addEventListener('pagehide',stop);log('HTTPS 보안 환경: '+isSecureContext);log(navigator.userAgent);
</script></body></html>
